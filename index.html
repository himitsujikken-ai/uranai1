<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>神羅万象・八十一占</title>
<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
<style>
    /* --- デザインテーマ：宇宙の銀座 × 深海 --- */
    :root {
        --deep-sea-top: #0f2027;
        --deep-sea-mid: #203a43;
        --deep-sea-bot: #2c5364;
        --ginza-gold: #c5a059;
        --ginza-silver: #e0e0e0;
        --neon-glow: rgba(197, 160, 89, 0.3);
    }

    body {
        font-family: "Hiragino Mincho ProN", "Yu Mincho", "Zen Old Mincho", serif;
        background: linear-gradient(180deg, #050510 0%, #0a1525 40%, #001f3f 100%);
        margin: 0; padding: 0;
        color: var(--ginza-silver);
        display: flex; flex-direction: column; align-items: center;
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;
    }

    /* 背景のエフェクト */
    .stars {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        background-image: 
            radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px),
            radial-gradient(white, rgba(255,255,255,.15) 1px, transparent 2px);
        background-size: 550px 550px, 350px 350px;
        opacity: 0.3;
        z-index: -1;
    }

    /* --- ヘッダー --- */
    header {
        width: 100%;
        padding: 30px 20px 20px;
        text-align: center;
        background: rgba(0,0,0,0.3);
        backdrop-filter: blur(5px);
        border-bottom: 1px solid rgba(255,255,255,0.1);
        box-sizing: border-box;
        display: flex; flex-direction: column; align-items: center;
    }

    h1 {
        font-size: 24px;
        letter-spacing: 0.2em;
        color: var(--ginza-gold);
        text-shadow: 0 0 10px var(--neon-glow);
        margin: 0 0 20px 0;
    }
    
    /* トップバナー画像エリア */
    .top-banner {
        width: 100%;
        max-width: 600px;
        margin-bottom: 25px;
        border-radius: 4px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1);
    }
    .top-banner img {
        width: 100%;
        height: auto;
        display: block;
    }

    .intro-text {
        font-size: 13px;
        line-height: 1.9;
        max-width: 600px;
        margin: 0 auto;
        color: #ccc;
        text-align: left;
    }
    
    .intro-highlight { color: var(--ginza-gold); font-weight: bold; }

    /* 注意書きリストのデザイン */
    .usage-guide {
        margin-top: 20px;
        padding: 15px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
        border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .usage-guide ul {
        margin: 0;
        padding-left: 1.2em;
    }
    .usage-guide li {
        margin-bottom: 5px;
    }
    .usage-guide li:last-child {
        margin-bottom: 0;
    }

    /* --- メニュー --- */
    .container {
        width: 90%; max-width: 450px; margin-top: 30px; padding-bottom: 80px;
        display: flex; flex-direction: column; gap: 15px;
        box-sizing: border-box;
        padding-left: 20px; padding-right: 20px;
    }

    .menu-btn {
        position: relative; width: 100%; padding: 20px;
        background: rgba(255, 255, 255, 0.05);
        color: #fff;
        border: 1px solid rgba(197, 160, 89, 0.3);
        border-radius: 2px;
        font-family: "Hiragino Mincho ProN", serif;
        font-size: 16px; letter-spacing: 0.1em;
        cursor: pointer; transition: all 0.3s ease; overflow: hidden;
        -webkit-tap-highlight-color: transparent;
    }
    .menu-btn:active { transform: scale(0.98); background: rgba(197, 160, 89, 0.2); }

    /* --- 結果モーダル（縦表示） --- */
    #result-area {
        display: none; 
        position: fixed; top: 0; left: 0;
        width: 100%; height: 100%;
        flex-direction: column; justify-content: center; align-items: center;
        gap: 15px; 
        z-index: 1000;
        background-color: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(8px);
        opacity: 0; transition: opacity 0.5s ease;
        padding: 20px; box-sizing: border-box;
    }
    #result-area.show { opacity: 1; }

    /* 撮影対象となるボックス */
    .result-box {
        width: 100%; max-width: 400px; padding: 40px 25px;
        border-radius: 4px; text-align: center; position: relative;
        box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        max-height: 55vh; overflow-y: auto;
        border: 1px solid rgba(255,255,255,0.1);
        transform: scale(0.95); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #result-area.show .result-box { transform: scale(1); }

    /* モード別デザイン */
    .mode-iching {
        background: linear-gradient(145deg, #1e2a38, #131a25);
        border: 1px solid #4a6fa5; color: #e0f7fa;
    }
    .mode-iching .symbol { color: #81d4fa; text-shadow: 0 0 10px #0277bd; }

    .mode-god {
        background: linear-gradient(135deg, #2c2507, #000000);
        border: 2px solid #FFD700; color: #FFD700;
        box-shadow: 0 0 40px rgba(255, 215, 0, 0.4);
    }
    .mode-god .symbol { text-shadow: 0 0 20px #FFD700; }

    .mode-override {
        background: linear-gradient(to bottom, #102027 0%, #1c3b4a 40%, #463815 100%);
        border: 2px solid #e0aa3e; color: #fff;
    }

    /* テキストスタイル */
    .symbol { font-size: 70px; margin-bottom: 10px; line-height: 1; display: block;}
    ruby { ruby-align: center; }
    rt { font-size: 0.5em; opacity: 0.8; font-weight: normal; color: inherit; }
    .name { font-size: 24px; font-weight: bold; margin-bottom: 5px; letter-spacing: 2px; }
    .sub-name { font-size: 12px; opacity: 0.7; margin-bottom: 20px; letter-spacing: 1px; }
    
    .desc-box {
        text-align: left; font-size: 15px; line-height: 1.8;
        padding: 20px; background-color: rgba(0,0,0,0.3);
        border-radius: 4px; margin-bottom: 10px;
        border-left: 3px solid rgba(255,255,255,0.2);
    }

    .override-sign {
        margin: 25px 0 10px 0; font-size: 18px; font-weight: bold;
        color: #ff4d4d; text-shadow: 0 0 10px rgba(255, 0, 0, 0.6);
        letter-spacing: 4px; animation: pulse 1.5s infinite alternate;
    }
    @keyframes pulse { from { opacity: 0.6; transform: scale(0.98); } to { opacity: 1; transform: scale(1.02); } }

    .god-voice {
        font-family: serif; font-weight: bold; color: #FFD700;
        background-color: rgba(0,0,0,0.6); border: 1px solid #FFD700;
        padding: 15px; margin-top: 10px;
        box-shadow: 0 0 15px rgba(255, 215, 0, 0.1);
        text-align: left; line-height: 1.6;
    }

    /* アクションボタン群（縦表示） */
    .action-area {
        width: 100%; max-width: 400px;
        display: flex; flex-direction: column; gap: 10px;
        z-index: 1001;
    }

    /* ボタンの共通スタイル */
    .action-btn {
        padding: 14px; border: none; border-radius: 4px;
        font-size: 14px; font-weight: bold;
        cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
        transition: 0.2s; text-decoration: none;
    }
    .action-btn:active { transform: scale(0.96); opacity: 0.9; }

    /* 色設定 */
    .btn-share-img { background: linear-gradient(135deg, #d35400, #e67e22); color: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .btn-x { background-color: #000; color: #fff; border: 1px solid #333; }
    .btn-line { background-color: #06c755; color: #fff; }
    .btn-cal { background-color: #2c3e50; color: #fff; border: 1px solid #4ca1af; }
    
    .btn-close { 
        background-color: transparent; color: #aaa; border: 1px solid #555; 
        margin-top: 5px; padding: 10px;
    }

    /* SNSボタングループ（横並び） */
    .sns-group { display: flex; gap: 10px; }
    .sns-group .action-btn { flex: 1; }

</style>
</head>
<body>

<div class="stars"></div>

<header>
    <h1>八十一占<span style="font-size:11px; display:block; margin-top:5px; opacity:0.7;">SHINRA - BANSHO - GRID</span></h1>
    
    <div class="top-banner">
        <img src="image_18.png" alt="神羅万象グリッド・宇宙の凪と時化">
    </div>

    <div class="intro-text">
        <p>
            古来の<span class="intro-highlight">「易（64の現象）」</span>と、
            神話の<span class="intro-highlight">「神代十七代（17の神意）」</span>を融合させた、
            計81通りの『神羅万象グリッド』システム。
        </p>
        <p>
            宇宙のリズム（凪や時化）が、運命を強制的に書き換える
            <span class="intro-highlight">「オーバーライド（神意介入）」</span>の瞬間を見逃さないでください。
        </p>
        
        <div class="usage-guide">
            <ul>
                <li>生年月日など不要です。</li>
                <li>占いたいことをイメージをして三回宙に問い、ボタンを押してください。</li>
                <li>仕組みについての解説は準備中です</li>
            </ul>
        </div>
    </div>
</header>

<div class="container">
    <button class="menu-btn" onclick="divination('展望')">展望</button>
    <button class="menu-btn" onclick="divination('受け取るべきこと')">受け取るべきこと</button>
    <button class="menu-btn" onclick="divination('望みの実現')">望みの実現</button>
    <button class="menu-btn" onclick="divination('相手の気持ち')">相手の気持ち</button>
    <button class="menu-btn" onclick="divination('人間関係')">人間関係</button>
    <button class="menu-btn" onclick="divination('仕事運')">仕事運</button>
    <button class="menu-btn" onclick="divination('金運')">金運</button>
</div>

<div id="result-area">
    
    <div id="capture-target" class="result-box">
        <div id="result-content"></div>
    </div>
    
    <div class="action-area" id="action-buttons" style="display:none;">
        
        <button onclick="shareImage()" class="action-btn btn-share-img">
            📷 画像でシェア
        </button>

        <div class="sns-group">
            <a id="btn-x" class="action-btn btn-x" target="_blank">𝕏 ポスト</a>
            <a id="btn-line" class="action-btn btn-line" target="_blank">LINE送る</a>
        </div>

        <a id="btn-cal" class="action-btn btn-cal" target="_blank">📅 カレンダー</a>
        
        <button onclick="closeResult()" class="action-btn btn-close">閉じる</button>
    </div>

</div>

    // --- 神代十七代データ ---

        { n: "宇比地邇神", r: "うひじにのかみ", d: "【泥土の結晶】<br>形なきものから、形あるものが生まれる。<br>混沌を恐れるな。その中にある宝を見つけ出せ。<br>始まりの時だ。" },

    // HTMLルビ生成ヘルパー
    function makeRuby(kanji, kana) {
        return `<ruby>${kanji}<rt>${kana}</rt></ruby>`;
    }

    // カレンダーURL生成
    function generateCalendarUrl(title, desc) {
        const now = new Date();
        const start = now.toISOString().replace(/-|:|\.\d\d\d/g, "");
        const endObj = new Date(now.getTime() + 60 * 60 * 1000);
        const end = endObj.toISOString().replace(/-|:|\.\d\d\d/g, "");
        
        const cleanDesc = desc.replace(/<br>/g, "\n").replace(/<[^>]+>/g, ""); 
        return `https://www.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent("【神羅万象占】" + title)}&dates=${start}/${end}&details=${encodeURIComponent(cleanDesc + "\n\n#神羅万象占い")}`;
    }

    // X投稿用URL生成
    function generateXUrl(text) {
        const url = location.href; // 現在のURL
        const tweet = `${text}\n\n#神羅万象占 #占い`;
        return `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweet)}&url=${encodeURIComponent(url)}`;
    }

    // LINEシェア用URL生成
    function generateLineUrl(text) {
        const url = location.href;
        return `https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(url)}&text=${encodeURIComponent(text)}`;
    }

    // --- ロジックの中枢 ---
    function divination(theme) {
        const modal = document.getElementById("result-area");
        const box = document.getElementById("capture-target");
        const content = document.getElementById("result-content");
        const actions = document.getElementById("action-buttons");
        
        // リセット
        box.className = "result-box"; 
        
        // 確率計算
        const primaryRoll = Math.floor(Math.random() * 81) + 1;
        
        let htmlContent = "";
        let modeClass = "";
        
        // シェア用テキストの準備
        let shareTextShort = ""; // SNS用短文
        let resultTitle = "";    // カレンダー用

        if (primaryRoll > 64) {
            // ■ パターンA：神の独壇場
            const godIndex = primaryRoll - 65; 
            const god = godsData[godIndex];
            
            modeClass = "mode-god";
            let symbol = (primaryRoll === 81) ? "✨" : "⛩️";
            
            shareTextShort = `【神意顕現】${god.n}が出ました。\n問：${theme}`;
            resultTitle = `神意顕現：${god.n}`;

            htmlContent = `
                <div class="symbol">${symbol}</div>
                <div class="name">${makeRuby(god.n, god.r)}</div>
                <div class="sub-name">問：${theme} / 【神意顕現】</div>
                <div class="desc-box" style="text-align:center; font-weight:bold; color:#FFD700; border-left:none;">
                    ${god.d}
                </div>
            `;

        } else {
            // ■ 易の結果
            const ichingIndex = primaryRoll - 1;
            const ichingItem = ichingData[ichingIndex];
            const overrideRoll = Math.floor(Math.random() * 64) + 1; 
            
            if (overrideRoll <= 17) {
                // ■ パターンB：オーバーライド
                const godIndex = Math.floor(Math.random() * 17);
                const god = godsData[godIndex];
                
                modeClass = "mode-override";
                shareTextShort = `【神意介入】${ichingItem.k} × ${god.n}。\n問：${theme}`;
                resultTitle = `神意介入：${ichingItem.k} × ${god.n}`;

                htmlContent = `
                    <div class="symbol">☯</div>
                    <div class="name">${makeRuby(ichingItem.k, ichingItem.r)}</div>
                    <div class="sub-name">問：${theme} / 現象：第${primaryRoll}卦</div>
                    <div class="desc-box">${ichingItem.d}</div>
                    <div class="override-sign">⚡️ 神意介入 ⚡️</div>
                    <div class="god-voice">
                        <strong>【${makeRuby(god.n, god.r)}】の神託：</strong><br>
                        ${god.d}<br>
                        <span style="font-size:11px; font-weight:normal; display:block; margin-top:8px; opacity:0.8;">※宇宙の律動により、運命は再定義されました。</span>
                    </div>
                `;
            } else {
                // ■ パターンC：易のみ
                modeClass = "mode-iching";
                shareTextShort = `【現象】${ichingItem.k}が出ました。\n問：${theme}`;
                resultTitle = `現象：${ichingItem.k}`;

                htmlContent = `
                    <div class="symbol">☯</div>
                    <div class="name">${makeRuby(ichingItem.k, ichingItem.r)}</div>
                    <div class="sub-name">問：${theme} / 現象：第${primaryRoll}卦</div>
                    <div class="desc-box">${ichingItem.d}</div>
                `;
            }
        }

        // 描画
        box.classList.add(modeClass);
        content.innerHTML = htmlContent;
        
        // 外部連携URLのセット
        const calDesc = content.innerText;
        document.getElementById("btn-cal").href = generateCalendarUrl(resultTitle, calDesc);
        document.getElementById("btn-x").href = generateXUrl(shareTextShort);
        document.getElementById("btn-line").href = generateLineUrl(shareTextShort);

        // モーダル表示
        modal.style.display = "flex";
        setTimeout(() => { 
            modal.classList.add("show");
            actions.style.display = "flex";
        }, 10);
    }

    // --- 画像シェア機能 ---
    async function shareImage() {
        const target = document.getElementById("capture-target");
        try {
            const canvas = await html2canvas(target, { backgroundColor: null, scale: 2 });
            canvas.toBlob(async (blob) => {
                const file = new File([blob], "uranai_result.png", { type: "image/png" });
                if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                    await navigator.share({
                        files: [file],
                        title: '神羅万象占いの結果',
                        text: '私の運命が示されました。 #神羅万象占'
                    });
                } else {
                    const link = document.createElement("a");
                    link.download = "uranai_result.png";
                    link.href = canvas.toDataURL();
                    link.click();
                    alert("画像を保存しました。SNSアプリを開いて投稿してください。");
                }
            });
        } catch (e) {
            alert("画像の生成に失敗しました。\n" + e);
        }
    }

    function closeResult() {
        const modal = document.getElementById("result-area");
        const actions = document.getElementById("action-buttons");
        modal.classList.remove("show");
        actions.style.display = "none";
        setTimeout(() => { modal.style.display = "none"; }, 500);
    }
</script>
