<style>

        --ginza-gold: #c5a059;
        --neon-cyan: #00f2ff;

        overflow-x: hidden;
        -webkit-text-size-adjust: 100%;

        position: fixed; top: 0; left: 0; width: 100%; height: 100%;

            linear-gradient(90deg, rgba(0, 255, 255, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: perspective(500px) rotateX(60deg);
        transform-origin: top center;
        z-index: -2;
        animation: gridMove 20s linear infinite;
        opacity: 0.3;
    }
    @keyframes gridMove { from { background-position: 0 0; } to { background-position: 0 1000px; } }

    .stars {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none;
        background-image: radial-gradient(white, rgba(255,255,255,.2) 2px, transparent 3px);
        background-size: 550px 550px;
        opacity: 0.5; z-index: -1;
    }

    /* --- ヘッダー --- */

        width: 100%; padding: 40px 20px 20px; text-align: center;
        background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);

    h1 {
        font-size: 28px; color: var(--ginza-gold);

    .highlight { color: var(--ginza-gold); font-weight: bold; border-bottom: 1px dotted var(--ginza-gold); }

    /* --- メニュー（コマンドセンター風） --- */
    .container {
        width: 90%; max-width: 450px; padding-bottom: 100px;
        display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
    }

    .menu-btn {
        position: relative; width: 100%; padding: 25px 10px;
        background: rgba(255, 255, 255, 0.03);
        color: var(--neon-cyan);
        border: 1px solid rgba(0, 242, 255, 0.3);
        border-radius: 4px;
        font-family: "Hiragino Mincho ProN", serif;
        font-size: 14px; letter-spacing: 0.05em;
        cursor: pointer; transition: 0.2s;
        box-shadow: 0 0 10px rgba(0, 242, 255, 0.1);

    .menu-btn:active { transform: scale(0.96); background: rgba(0, 242, 255, 0.1); }
    .menu-btn span { display: block; font-size: 10px; opacity: 0.6; margin-top: 5px; }
    
    .menu-btn.full-width { grid-column: 1 / 3; border-color: var(--ginza-gold); color: var(--ginza-gold); }

    #loading-overlay {
        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: #000; z-index: 2000;
        flex-direction: column; justify-content: center; align-items: center;
        font-family: monospace; color: var(--neon-cyan);

    .glitch-text { font-size: 20px; animation: blink 0.1s infinite; }
    .progress-bar { width: 200px; height: 2px; background: #333; margin-top: 10px; overflow: hidden; }
    .progress-fill { width: 0%; height: 100%; background: var(--neon-cyan); transition: width 1.5s ease-out; }

    /* --- 結果モーダル --- */

        display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;

        width: 100%; max-width: 400px; padding: 40px 20px;

        box-shadow: 0 0 50px rgba(0,0,0,0.8);

    .name { font-size: 28px; font-weight: bold; margin: 10px 0; letter-spacing: 0.1em; color: #fff; }
    .sub-name { font-size: 11px; color: #888; letter-spacing: 1px; margin-bottom: 20px; font-family: monospace; }
    
    .desc-box {
        text-align: left; font-size: 15px; line-height: 1.8;

        border-radius: 4px; margin-top: 10px;

    .override-badge {
        display: inline-block; background: #FF0000; color: #fff;

        box-shadow: 0 0 15px #FF0000; margin-bottom: 10px;

    .action-btn {

        display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; font-size: 14px;
        transition: transform 0.1s;
    }

    .btn-share { background: #fff; color: #000; }
    .btn-x { background: #000; color: #fff; border: 1px solid #333; }
    .btn-close { background: transparent; color: #666; margin-top: 10px; }

        { k: "巽為風", r: "そんいふう", d: "【風の侵入】どこへでも入り込む。謙虚に従順に行動すれば、どんな扉も開く。" },
        { k: "兌為沢", r: "だいたく", d: "【微笑み】喜びの共有。笑顔で会話すれば、運気はさらにブーストする。" },
        { k: "風水渙", r: "ふうすいかん", d: "【離散と解放】悩みが霧散する。遠出や冒険に出ることで、新しい道が開ける。" },
        { k: "水沢節", r: "すいたくせつ", d: "【節度】制限の中にこそ自由がある。竹の節のように、けじめをつける時。" },
        { k: "風沢中孚", r: "ふうたくちゅうふ", d: "【真心通信】誠実さの勝利。真心があれば、異種族（豚や魚）とも通信可能。" },
        { k: "雷山小過", r: "らいざんしょうか", d: "【低空飛行】飛び過ぎる鳥は撃たれる。高望みせず、謙虚に低く飛べ。" },
        { k: "水火既済", r: "すいかきせい", d: "【コンプリート】完成した。これ以上の発展はない。現状維持（守成）が最大のミッション。" },
        { k: "火水未済", r: "かすいびせい", d: "【未完成】まだ整っていないが、希望がある。物語はここから始まる。" }
    ];

    const godsData = [
        { n: "国常立尊", r: "くにのとこたち", d: "【基盤確立】<br>大地のOS。迷いを断ち切り足元を固めよ。揺るぎない信念が最強のセキュリティとなる。" },
        { n: "豊雲野神", r: "とよくもの", d: "【クラウドの始祖】<br>可能性は無限。枠に囚われるな。まだ見ぬ領域へアクセスせよ。" },
        { n: "宇比地邇神", r: "うひじに", d: "【泥土の結晶】<br>形なきデータから、形あるものが生まれる。混沌の中に宝がある。ビルドせよ。" },
        { n: "須比智邇神", r: "すひちに", d: "【砂土の堆積】<br>一足飛びの成功はない。ログの積み重ねが強固な地盤となる。継続せよ。" },
        { n: "角杙神", r: "つのぐい", d: "【発芽プロトコル】<br>土を突き破り芽が出る。新しいプロジェクトが動き出す初期衝動を逃すな。" },
        { n: "活杙神", r: "いくぐい", d: "【生命エネルギー】<br>活力がみなぎる。バグを恐れず勢いに乗れ。今ならどんな壁も貫通できる。" },
        { n: "意富斗能地神", r: "おおとのじ", d: "【論理的決定】<br>男性原理。待つのではなく掴み取れ。論理と意志の力でルートを確定せよ。" },
        { n: "大斗乃弁神", r: "おおとのべ", d: "【受容的創造】<br>女性原理。受け入れ育む時。強引さよりUI/UX（優しさ）が事態を好転させる。" },
        { n: "於母陀流神", r: "おもだる", d: "【完全な美】<br>調和が訪れる。バグのないコードのような美しさ。満ち足りた心が幸運を呼ぶ。" },
        { n: "阿夜訶志古泥神", r: "あやかしこね", d: "【感性の共鳴】<br>ロジックを超えた感覚を信じよ。畏敬の念を持つ時、あなたは守られている。" },
        { n: "伊邪那岐命", r: "いざなぎ", d: "【創造の父】<br>国生み。新しい世界を創る時。過去のログを捨て、前だけを見て実装せよ。" },
        { n: "伊邪那美命", r: "いざなみ", d: "【再生の母】<br>一度死して再誕する。リブートせよ。古い殻を脱ぎ捨て、より強く生まれ変われ。" },
        { n: "天之常立神", r: "あめのとこたち", d: "【天の恒久性】<br>視座をクラウドへ。目先の損得ではなく、永遠に続くアーキテクチャを築け。" },
        { n: "宇摩志阿斯訶備比古遅神", r: "うましあしかびひこじ", d: "【爆発的成長】<br>葦が伸びるごとし。圧倒的エネルギーで突破せよ。バイラル係数が最大化している。" },
        { n: "神産巣日神", r: "かみむすび", d: "【修復と統合】<br>バグは修正される。対立はマージされる。安心してシステムに身を委ねよ。" },
        { n: "高御産巣日神", r: "たかみむすび", d: "【高次元ガイド】<br>あなたは選ばれた。直感はサーバーからの指令だ。見えない力がバックアップしている。" },
        { n: "天之御中主神", r: "あめのみなかぬし", d: "【ROOT権限・宇宙の中心】<br>始原の神が告げる。全宇宙があなたを肯定している。迷うな、絶対実行（Run）せよ。" }
    ];

    function makeRuby(kanji, kana) {
        return `<ruby>${kanji}<rt>${kana}</rt></ruby>`;
    }

    // シェア用URL生成
    function generateXUrl(text) {
        const url = location.href;
        const tweet = `${text}\n\n#神羅万象グリッド #運命のデバッグ`;
        return `https://twitter.com/intent/tweet?text=${encodeURIComponent(tweet)}&url=${encodeURIComponent(url)}`;
    }
    function generateLineUrl(text) {
        return `https://social-plugins.line.me/lineit/share?url=${encodeURIComponent(location.href)}&text=${encodeURIComponent(text)}`;
    }

    // 占いロジック
    function divination(themeJp, themeEn) {
        // ローディング演出開始
        const loader = document.getElementById("loading-overlay");
        const fill = document.getElementById("progress-fill");
        const loadText = document.getElementById("loading-text");
        
        loader.style.display = "flex";
        fill.style.width = "0%";
        
        // ローディングテキストのアニメーション
        let progress = 0;
        const interval = setInterval(() => {
            progress += Math.floor(Math.random() * 15);
            if(progress > 100) progress = 100;
            fill.style.width = `${progress}%`;
            
            const texts = ["ANALYZING FATE...", "CONNECTING TO GODS...", "DECODING ICHING...", "SYNCING 64 GRIDS..."];
            loadText.innerText = texts[Math.floor(Math.random() * texts.length)];
            
            if(progress === 100) {
                clearInterval(interval);
                setTimeout(() => {
                    loader.style.display = "none";
                    showResult(themeJp, themeEn);
                }, 300);
            }
        }, 150);
    }

    function showResult(themeJp, themeEn) {
        const modal = document.getElementById("result-area");
        const box = document.getElementById("capture-target");
        const content = document.getElementById("result-content");
        const actions = document.getElementById("action-buttons");

        box.className = "result-box"; 
        const primaryRoll = Math.floor(Math.random() * 81) + 1;
        let htmlContent = "";
        let shareText = "";

        if (primaryRoll > 64) {
            // パターンA：神（SSR）
            const god = godsData[primaryRoll - 65];
            box.classList.add("mode-god");
            shareText = `【神意顕現】${god.n}が降臨しました。運命が書き換わります。`;
            
            htmlContent = `
                <div class="symbol">⛩️</div>
                <div class="name">${makeRuby(god.n, god.r)}</div>
                <div class="sub-name">CODE: GOD / ${themeEn}</div>
                <div class="override-badge">SSR: DIVINE INTERVENTION</div>
                <div class="desc-box" style="border:1px solid #FFD700; color:#FFD700;">
                    ${god.d}
                </div>
            `;
        } else {
            const ichingItem = ichingData[primaryRoll - 1];
            const overrideRoll = Math.floor(Math.random() * 64) + 1;

            if (overrideRoll <= 17) {
                // パターンB：オーバーライド（SR）
                const god = godsData[Math.floor(Math.random() * 17)];
                box.classList.add("mode-override");
                shareText = `【運命介入】${ichingItem.k}の結果が、${god.n}によってオーバーライドされました。`;

                htmlContent = `
                    <div class="symbol">⚡️</div>
                    <div class="name">${makeRuby(ichingItem.k, ichingItem.r)}</div>
                    <div class="sub-name">LOG: HEXAGRM ${primaryRoll} / ${themeEn}</div>
                    <div class="desc-box" style="opacity:0.7; text-decoration:line-through; font-size:12px;">
                        当初の予測：${ichingItem.d.substring(0, 20)}...
                    </div>
                    <div class="override-badge">⚠️ OVERRIDE DETECTED</div>
                    <div class="desc-box" style="border:1px solid #FF0000; background:rgba(255,0,0,0.1);">
                        <strong>>> ${makeRuby(god.n, god.r)} の介入：</strong><br>
                        ${god.d}
                    </div>
                `;
            } else {
                // パターンC：通常（N）
                box.classList.add("mode-iching");
                shareText = `【解析結果】${ichingItem.k}。${themeJp}についての運命が出ました。`;

                htmlContent = `
                    <div class="symbol">☯</div>
                    <div class="name">${makeRuby(ichingItem.k, ichingItem.r)}</div>
                    <div class="sub-name">LOG: HEXAGRM ${primaryRoll} / ${themeEn}</div>
                    <div class="desc-box">
                        ${ichingItem.d}
                    </div>
                `;
            }
        }

        content.innerHTML = htmlContent;
        document.getElementById("btn-x").href = generateXUrl(shareText);
        document.getElementById("btn-line").href = generateLineUrl(shareText);

        modal.style.display = "flex";
        setTimeout(() => { 
            modal.classList.add("show"); 
            actions.style.display = "flex";
        }, 50);
    }

    // 画像保存（変更なし）
    async function shareImage() {
        const target = document.getElementById("capture-target");
        try {
            const canvas = await html2canvas(target, { backgroundColor: null, scale: 2 });
            const link = document.createElement("a");
            link.download = "shinra_grid_result.png";
            link.href = canvas.toDataURL();
            link.click();
        } catch (e) { alert("Error: " + e); }
    }

    function closeResult() {
        const modal = document.getElementById("result-area");
        modal.classList.remove("show");
        setTimeout(() => { modal.style.display = "none"; }, 500);
    }
</script>
